<svg style="display: none;">
    <defs>
        <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="100%" stop-color="#4facfe" />

<style>
    @keyframes borderGlow {
        0% { border-color: rgba(0, 242, 254, 0.3); box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 15px rgba(0, 242, 254, 0.2); }
        50% { border-color: rgba(79, 172, 254, 0.7); box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 0 30px rgba(0, 242, 254, 0.4); }
        100% { border-color: rgba(0, 242, 254, 0.3); box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 15px rgba(0, 242, 254, 0.2); }
    }

    .luxury-header {
        position: relative;
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
        background: linear-gradient(135deg, rgba(13, 27, 42, 0.94), rgba(27, 38, 59, 0.94));
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(0, 242, 254, 0.3);
        border-radius: 14px;
        padding: 10px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        animation: borderGlow 6s infinite ease-in-out;
        z-index: 1000;
        font-family: 'Inter', 'Segoe UI', sans-serif;
        transform: scale(1);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
    }

    .luxury-header *, .luxury-header *::before, .luxury-header *::after {
        box-sizing: border-box !important;
    }

    .luxury-header:hover {
        transform: scale(1.01);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 0 35px rgba(0, 242, 254, 0.4);
    }

    .brand-container {
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        flex: 0 0 auto;
    }

    .calc-logo-icon {
        width: 38px;
        height: 38px;
        min-width: 38px;
        min-height: 38px;
        background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(79, 172, 254, 0.15));
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid rgba(0, 242, 254, 0.5);
        box-shadow: 
            0 0 12px rgba(0, 242, 254, 0.4),
            inset 0 0 8px rgba(79, 172, 254, 0.3);
        position: relative;
        transform-style: preserve-3d;
        perspective: 500px;
        transition: transform 0.1s ease-out, box-shadow 0.3s ease;
        flex-shrink: 0;
    }

    .calc-logo-icon:hover {
        box-shadow: 
            0 0 20px rgba(0, 242, 254, 0.8),
            0 0 30px rgba(79, 172, 254, 0.5);
    }

    .calculator-svg {
        width: 22px;
        height: 22px;
        filter: drop-shadow(0 0 4px rgba(0, 242, 254, 0.8));
    }

    .logo-text-group {
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
    }

    .logo-title {
        font-size: 15px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        background: linear-gradient(135deg, #00f2fe, #4facfe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        white-space: nowrap;
        line-height: 1.1;
    }

    .logo-tagline {
        font-size: 9px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #90e0ef;
        text-shadow: 0 0 6px rgba(144, 224, 239, 0.4);
        white-space: nowrap;
        line-height: 1.1;
        margin-top: 1px;
    }

    nav {
        flex: 1;
        display: flex;
        justify-content: center;
    }

    .nav-links {
        display: flex;
        list-style: none;
        gap: 8px;
        align-items: center;
        margin: 0;
        padding: 0;
    }

    .nav-links li a {
        text-decoration: none;
        font-size: 12.5px;
        font-weight: 600;
        color: #e0fbfc;
        position: relative;
        padding: 6px 14px;
        border-radius: 8px;
        background: transparent;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
        display: inline-block;
        white-space: nowrap;
    }

    .nav-links li a span {
        position: relative;
        z-index: 2;
        display: inline-block;
        transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .nav-links li a:active span {
        transform: scale(0.85);
    }

    .nav-links li a::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.2));
        border: 1px solid rgba(0, 242, 254, 0.5);
        border-radius: 8px;
        box-shadow: 0 0 12px rgba(0, 242, 254, 0.3), inset 0 0 8px rgba(0, 242, 254, 0.2);
        opacity: 0;
        transform: scale(0.8) translateY(5px);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-links li a::after {
        content: '';
        position: absolute;
        bottom: 2px;
        left: 20%;
        width: 60%;
        height: 2px;
        background: #00f2fe;
        box-shadow: 0 0 6px #00f2fe;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .nav-links li a:hover::before,
    .nav-links li a.active::before {
        opacity: 1;
        transform: scale(1) translateY(0);
    }

    .nav-links li a:hover::after,
    .nav-links li a.active::after {
        opacity: 1;
    }

    .nav-links li a:hover,
    .nav-links li a.active {
        color: #00f2fe;
        text-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
        transform: translateY(-1px);
    }

    .menu-toggle {
        display: none;
        flex-direction: column;
        cursor: pointer;
        gap: 5px;
        flex-shrink: 0;
    }

    .menu-toggle span {
        width: 22px;
        height: 2px;
        background: #00f2fe;
        border-radius: 2px;
        box-shadow: 0 0 5px #00f2fe;
        transition: all 0.3s ease;
    }

    @media (max-width: 1024px) {
        .luxury-header {
            width: 100% !important;
            padding: 10px 15px;
        }

        nav {
            flex: unset;
        }

        .nav-links {
            position: absolute;
            top: 110%;
            left: 0;
            width: 100%;
            background: rgba(13, 27, 42, 0.98);
            backdrop-filter: blur(20px);
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 12px;
            border-radius: 12px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.8);
            transform: translateY(-20px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
        }

        .nav-links.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .nav-links li {
            width: 85%;
            text-align: center;
        }

        .nav-links li a {
            display: block;
            width: 100%;
            padding: 10px 16px;
        }

        .menu-toggle {
            display: flex;
        }
    }
</style>

<script>
    const mobileMenu = document.getElementById('mobile-menu');
    const navLinks = document.querySelector('.nav-links');

    if(mobileMenu && navLinks) {
        mobileMenu.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    }

    const tiltLogo = document.getElementById('tiltLogo');
    if(tiltLogo) {
        tiltLogo.addEventListener('mousemove', (e) => {
            const rect = tiltLogo.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            
            const rotateX = (-y / 3);
            const rotateY = (x / 3);
            
            tiltLogo.style.transform = `perspective(500px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
        });

        tiltLogo.addEventListener('mouseleave', () => {
            tiltLogo.style.transform = 'perspective(500px) rotateX(0deg) rotateY(0deg) scale(1)';
        });
    }
</script>

<!-- Agar aapne canvas wala neon favicon use karna hai, toh isko script tag mein rakh lein: -->
<script>
    (function() {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#030712';
        ctx.fillRect(0, 0, 128, 128);
        ctx.shadowColor = '#06b6d4';
        ctx.shadowBlur = 15;
        ctx.lineWidth = 12;
        ctx.strokeStyle = '#06b6d4';
        ctx.beginPath();
        ctx.roundRect(16, 16, 96, 96, 24);
        ctx.stroke();
        ctx.fillStyle = '#22d3ee';
        ctx.font = 'bold 64px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('C', 64, 66);

        const dataURL = canvas.toDataURL('image/png');
        let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
        link.type = 'image/x-icon';
        link.rel = 'shortcut icon';
        link.href = dataURL;
        document.head.appendChild(link);
    })();
</script>
